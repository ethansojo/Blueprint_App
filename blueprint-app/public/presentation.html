  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

ight: 700;\n  font-display: swap;\n  src: url(\"3299ef28-6262-4b45-8a2e-9882b67baf56\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n/* cyrillic-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"2742a9cf-0fd6-4a12-99a0-d3fbecd8ab51\") format('woff2');\n  unicode-range: U+0460-052F, U+1C80-1C8A, U+20B4, U+2DE0-2DFF, U+A640-A69F, U+FE2E-FE2F;\n}\n/* cyrillic */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"82a30527-85fc-4a6c-885f-ee4d2907bdf9\") format('woff2');\n  unicode-range: U+0301, U+0400-045F, U+0490-0491, U+04B0-04B1, U+2116;\n}\n/* greek */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"715e67e0-4a8e-4323-9a4e-718f6894da61\") format('woff2');\n  unicode-range: U+0370-0377, U+037A-037F, U+0384-038A, U+038C, U+038E-03A1, U+03A3-03FF;\n}\n/* vietnamese */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"303f9e98-c028-49eb-a0ac-6b1be808c300\") format('woff2');\n  unicode-range: U+0102-0103, U+0110-0111, U+0128-0129, U+0168-0169, U+01A0-01A1, U+01AF-01B0, U+0300-0301, U+0303-0304, U+0308-0309, U+0323, U+0329, U+1EA0-1EF9, U+20AB;\n}\n/* latin-ext */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"445ea373-571f-45d4-b42b-66164d74518b\") format('woff2');\n  unicode-range: U+0100-02BA, U+02BD-02C5, U+02C7-02CC, U+02CE-02D7, U+02DD-02FF, U+0304, U+0308, U+0329, U+1D00-1DBF, U+1E00-1E9F, U+1EF2-1EFF, U+2020, U+20A0-20AB, U+20AD-20C0, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'Manrope';\n  font-style: normal;\n  font-weight: 800;\n  font-display: swap;\n  src: url(\"3299ef28-6262-4b45-8a2e-9882b67baf56\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<style>\n  :root{\n    /* Sojo Shield — same tokens as the diagram */\n    --page:#0F1213;\n    --surface-2:#1E2225;\n    --surface-3:#262B2F;\n    --surface-4:#383E43;\n    --hairline:rgba(56,62,67,0.45);\n    --hairline-strong:rgba(56,62,67,0.85);\n    --ink:#FFFFFF;\n    --ink-2:#D5DADE;\n    --ink-dim:#8A949C;\n    --ink-dim-2:#5A636A;\n    /* Tab accent colors — signature per tab (A5) */\n    /* Tab 0 — Current State (red/coral, bottleneck-ish) */\n    --accent-0:#FF8A6A;\n    --accent-0-dim:#A35640;\n    --accent-0-bg:rgba(255,138,106,0.08);\n    --accent-1:#8B7FEA;   /* Why blueprint — purple */\n    --accent-1-dim:#5E55A0;\n    --accent-1-bg:rgba(139,127,234,0.08);\n    --accent-2:#4FD4A8;   /* Diagram — teal */\n    --accent-2-dim:#2A9374;\n    --accent-2-bg:rgba(79,212,168,0.08);\n    --accent-3:#5BA2F5;   /* Next steps — blue */\n    --accent-3-dim:#3A74B8;\n    --accent-3-bg:rgba(91,162,245,0.08);\n    --accent-4:#F5C147;\n    --accent-5:#FF8A6A;\n  }\n  *{box-sizing:border-box;margin:0;padding:0;}\n  html,body{background:var(--page);color:var(--ink);height:100%;}\n  body{\n    font-family:'Manrope',sans-serif;\n    min-height:100vh;\n    display:flex;align-items:flex-start;justify-content:center;\n    padding:16px 16px;\n  }\n  button{font-family:inherit;}\n\n  /* Shell */\n  .app{\n    width:100%;max-width:none;\n    background:var(--surface-2);\n    border:1px solid var(--hairline-strong);\n    border-radius:18px;\n    overflow:hidden;\n    box-shadow:0 20px 60px rgba(0,0,0,0.4);\n    position:relative;\n  }\n  /* Accent bar at the top of the shell — swaps color per active tab (A5) */\n  .accent-bar{\n    height:3px;width:100%;\n    background:var(--accent-0);\n    transition:background 250ms cubic-bezier(.2,0,0,1);\n  }\n  .app[data-tab=\"1\"] .accent-bar{background:var(--accent-1);}\n  .app[data-tab=\"2\"] .accent-bar{background:var(--accent-2);}\n  .app[data-tab=\"3\"] .accent-bar{background:var(--accent-3);}\n\n  /* Header */\n  .app-header{padding:18px 26px 0;}\n  .brand{\n    font-size:10px;font-weight:700;letter-spacing:.16em;\n    text-transform:uppercase;color:var(--ink-dim);margin-bottom:14px;\n  }\n\n  /* Tabs */\n  .tab-bar{display:flex;gap:0;border-bottom:1px solid var(--hairline);}\n  .tab-btn{\n    flex:1;padding:14px 10px;background:transparent;border:none;\n    color:var(--ink-dim);cursor:pointer;\n    font-size:13px;font-weight:600;letter-spacing:.01em;\n    border-bottom:2px solid transparent;\n    display:flex;align-items:center;justify-content:center;gap:8px;\n    transition:color 160ms, border-color 160ms, background 160ms;\n    position:relative;\n  }\n  .tab-btn:hover{color:var(--ink-2);background:rgba(255,255,255,0.02);}\n  .tab-btn .dot{\n    width:8px;height:8px;border-radius:999px;flex-shrink:0;\n    transition:transform 160ms;\n  }\n  .tab-btn[data-tab=\"0\"] .dot{background:var(--accent-0);}\n  .tab-btn[data-tab=\"1\"] .dot{background:var(--accent-1);}\n  .tab-btn[data-tab=\"2\"] .dot{background:var(--accent-2);}\n  .tab-btn[data-tab=\"3\"] .dot{background:var(--accent-3);}\n  .tab-btn.active{color:var(--ink);}\n  .tab-btn[data-tab=\"0\"].active{border-bottom-color:var(--accent-0);}\n  .tab-btn[data-tab=\"1\"].active{border-bottom-color:var(--accent-1);}\n  .tab-btn[data-tab=\"2\"].active{border-bottom-color:var(--accent-2);}\n  .tab-btn[data-tab=\"3\"].active{border-bottom-color:var(--accent-3);}\n  .tab-btn.active .dot{transform:scale(1.25);}\n  .tab-kbd{\n    font-size:9px;font-weight:700;color:var(--ink-dim-2);\n    border:1px solid var(--hairline-strong);border-radius:4px;\n    padding:1px 5px;margin-left:6px;font-family:ui-monospace,monospace;\n  }\n\n  /* Layer stage — slide animation (A4) */\n  .stage{position:relative;overflow:hidden;min-height:520px;}\n  .layer{\n    display:none;\n    will-change:transform,opacity;\n    animation-duration:260ms;animation-timing-function:cubic-bezier(.2,0,0,1);animation-fill-mode:both;\n  }\n  .layer.active{display:block;}\n  @keyframes slideInRight{from{opacity:0;transform:translateX(24px);}to{opacity:1;transform:translateX(0);}}\n  @keyframes slideInLeft{from{opacity:0;transform:translateX(-24px);}to{opacity:1;transform:translateX(0);}}\n  .app[data-dir=\"fwd\"] .layer.active{animation-name:slideInRight;}\n  .app[data-dir=\"back\"] .layer.active{animation-name:slideInLeft;}\n\n  /* ===== Tab 1 — Why Blueprint ===== */\n  .l1-header{padding:22px 26px 14px;border-bottom:1px solid var(--hairline);}\n  .l1-title{font-size:20px;font-weight:700;color:var(--ink);letter-spacing:-.01em;margin-bottom:4px;}\n  .l1-sub{font-size:13px;color:var(--ink-dim);}\n  .l1-body{padding:16px 26px 22px;}\n\n  .point-card{\n    background:var(--surface-3);\n    border:1px solid var(--hairline);\n    border-left:3px solid var(--accent-1);\n    border-radius:10px;\n    margin-bottom:10px;\n    overflow:hidden;\n    transition:border-color 160ms, background 160ms;\n  }\n  .point-card:hover{background:#2A3034;}\n  .point-header{\n    padding:14px 18px;\n    display:flex;align-items:center;justify-content:space-between;gap:14px;\n    cursor:pointer;user-select:none;\n  }\n  .point-label{font-size:14px;font-weight:700;color:var(--ink);letter-spacing:-.005em;}\n  .point-chev{\n    font-size:10px;color:var(--ink-dim);transition:transform 200ms cubic-bezier(.2,0,0,1);\n    flex-shrink:0;\n  }\n  .point-card.open .point-chev{transform:rotate(90deg);}\n  .point-body{\n    display:grid;grid-template-rows:0fr;\n    transition:grid-template-rows 240ms cubic-bezier(.2,0,0,1);\n  }\n  .point-card.open .point-body{grid-template-rows:1fr;}\n  .point-body-inner{overflow:hidden;}\n  .point-body-pad{padding:0 18px 16px 18px;}\n\n  /* Before / After (B1) */\n  .ba-grid{\n    display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:12px;\n  }\n  .ba-cell{\n    border-radius:8px;padding:10px 12px;\n    border:1px solid var(--hairline);\n  }\n  .ba-cell.before{background:rgba(255,255,255,0.02);}\n  .ba-cell.after{background:var(--accent-1-bg);border-color:rgba(139,127,234,0.35);}\n  .ba-label{\n    font-size:9.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;\n    margin-bottom:6px;\n  }\n  .ba-cell.before .ba-label{color:var(--ink-dim);}\n  .ba-cell.after .ba-label{color:var(--accent-1);}\n  .ba-text{font-size:12px;line-height:1.55;color:var(--ink-2);}\n  .ba-cell.before{border-color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.015);}\n  .ba-cell.before .ba-label{color:var(--ink-dim);}\n  .ba-cell.before .ba-text{color:#E2E6EA;}\n\n  .point-detail{font-size:12.5px;color:var(--ink-2);line-height:1.6;}\n  .point-sub{\n    margin-top:10px;padding-top:10px;border-top:1px solid var(--hairline);\n    font-size:12px;color:var(--ink-dim);line-height:1.6;\n  }\n  .point-sub strong{color:var(--ink-2);font-weight:600;}\n\n  /* Landing card (B5) */\n  .landing-card{\n    margin-top:14px;padding:20px 22px;border-radius:12px;\n    background:linear-gradient(135deg, rgba(139,127,234,0.18) 0%, rgba(139,127,234,0.06) 100%);\n    border:1px solid rgba(139,127,234,0.4);\n    text-align:center;\n  }\n  .landing-kicker{\n    font-size:10px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;\n    color:var(--accent-1);margin-bottom:8px;\n  }\n  .landing-text{\n    font-size:16px;font-weight:600;color:var(--ink);line-height:1.45;letter-spacing:-.005em;\n    max-width:520px;margin:0 auto;\n  }\n\n  /* ===== Tab 2 — The Diagram (edge-to-edge) ===== */\n  .l2-wrap{padding:14px 18px 18px;}\n  .l2-head{\n    display:flex;align-items:center;justify-content:space-between;gap:12px;\n    margin-bottom:10px;flex-wrap:wrap;\n  }\n  .diagram-nav{display:flex;gap:6px;flex-wrap:wrap;}\n  .diag-btn{\n    padding:7px 14px;border-radius:999px;\n    border:1px solid var(--hairline-strong);\n    background:transparent;color:var(--ink-dim);\n    font-size:12px;font-weight:600;cursor:pointer;\n    transition:all 160ms;\n  }\n  .diag-btn:hover{color:var(--ink-2);border-color:var(--surface-4);}\n  .diag-btn.active{\n    background:var(--accent-2-bg);border-color:var(--accent-2);color:var(--accent-2);\n  }\n  .focus-btn{\n    padding:7px 14px;border-radius:8px;\n    border:1px solid var(--hairline-strong);\n    background:var(--surface-3);color:var(--ink-2);\n    font-size:11.5px;font-weight:700;cursor:pointer;\n    display:inline-flex;align-items:center;gap:6px;\n    transition:all 160ms;letter-spacing:.02em;\n  }\n  .focus-btn:hover{background:var(--surface-4);color:var(--ink);}\n  .focus-btn svg{width:12px;height:12px;}\n\n  /* Diagram container — scales to fit (C2) */\n  .diagram-stage{\n    position:relative;\n    background:var(--page);\n    border:1px solid var(--hairline);\n    border-radius:12px;\n    overflow:hidden;\n    /* fixed aspect so scaling is predictable */\n    aspect-ratio: 1540 / 1280;\n    width:100%;\n  }\n  .diagram-frame{\n    position:absolute;inset:0;\n    width:1540px;height:1280px;\n    transform-origin:top left;\n    border:none;\n    background:var(--page);\n  }\n  /* Fullscreen overlay (C3) */\n  .focus-overlay{\n    position:fixed;inset:0;z-index:100;\n    background:rgba(0,0,0,0.92);\n    display:none;\n    align-items:center;justify-content:center;\n    padding:24px;\n    animation:fadeOverlay 180ms ease;\n  }\n  .focus-overlay.open{display:flex;}\n  @keyframes fadeOverlay{from{opacity:0;}to{opacity:1;}}\n  .focus-stage{\n    width:100%;height:100%;position:relative;\n    background:var(--page);border-radius:12px;overflow:hidden;\n  }\n  .focus-close{\n    position:absolute;top:14px;right:14px;z-index:10;\n    width:36px;height:36px;border-radius:999px;\n    background:var(--surface-2);border:1px solid var(--hairline-strong);\n    color:var(--ink);font-size:20px;cursor:pointer;\n    display:flex;align-items:center;justify-content:center;\n    transition:background 160ms;\n  }\n  .focus-close:hover{background:var(--surface-4);}\n  .focus-frame{\n    position:absolute;inset:0;\n    width:1540px;height:1280px;\n    transform-origin:top left;\n    border:none;background:var(--page);\n  }\n  .focus-hint{\n    position:absolute;bottom:14px;left:50%;transform:translateX(-50%);\n    font-size:11px;color:var(--ink-dim);letter-spacing:.04em;\n    background:var(--surface-2);padding:6px 12px;border-radius:999px;\n    border:1px solid var(--hairline);\n  }\n\n  /* ===== Tab 3 — Next Steps ===== */\n  .l3-wrap{padding:22px 26px 22px;}\n  .l3-title{font-size:20px;font-weight:700;color:var(--ink);margin-bottom:4px;letter-spacing:-.01em;}\n  .l3-sub{font-size:13px;color:var(--ink-dim);margin-bottom:20px;}\n\n  /* Timeline spine (D1) */\n  .timeline{position:relative;padding-left:20px;}\n  .timeline::before{\n    content:'';position:absolute;left:13px;top:14px;bottom:14px;\n    width:2px;background:var(--hairline-strong);border-radius:1px;\n  }\n  .phase{position:relative;margin-bottom:10px;}\n  .phase-card{\n    background:var(--surface-3);\n    border:1px solid var(--hairline);\n    border-radius:10px;overflow:hidden;\n    margin-left:24px;\n    transition:border-color 160ms, background 160ms;\n  }\n  .phase-card:hover{background:#2A3034;}\n  .phase-header{\n    display:flex;align-items:center;gap:14px;padding:13px 16px;\n    cursor:pointer;user-select:none;\n  }\n  .phase-num{\n    position:absolute;left:-19px;top:13px;\n    width:28px;height:28px;border-radius:999px;\n    font-size:12px;font-weight:800;\n    display:flex;align-items:center;justify-content:center;\n    z-index:2;\n    border:2px solid var(--page);\n  }\n  .p1 .phase-num{background:var(--accent-1);color:var(--page);}\n  .p2 .phase-num{background:var(--accent-2);color:var(--page);}\n  .p3 .phase-num{background:var(--accent-3);color:var(--page);}\n  .p4 .phase-num{background:var(--accent-4);color:var(--page);}\n  .p5 .phase-num{background:var(--accent-5);color:var(--page);}\n\n  .phase-title-wrap{flex:1;min-width:0;}\n  .phase-title{font-size:14px;font-weight:700;color:var(--ink);margin-bottom:2px;letter-spacing:-.005em;}\n  .phase-subtitle{font-size:11.5px;color:var(--ink-dim);}\n  .phase-chev{font-size:10px;color:var(--ink-dim);transition:transform 200ms cubic-bezier(.2,0,0,1);}\n  .phase-card.open .phase-chev{transform:rotate(90deg);}\n  .phase-body{\n    display:grid;grid-template-rows:0fr;\n    transition:grid-template-rows 240ms cubic-bezier(.2,0,0,1);\n  }\n  .phase-card.open .phase-body{grid-template-rows:1fr;}\n  .phase-body-inner{overflow:hidden;}\n  .phase-body-pad{\n    padding:2px 16px 14px 16px;\n    border-top:1px solid var(--hairline);\n  }\n  .phase-item{\n    font-size:12.5px;color:var(--ink-2);padding:9px 12px;\n    border-left:2px solid var(--hairline-strong);\n    background:rgba(255,255,255,0.02);\n    border-radius:0 6px 6px 0;\n    margin-top:8px;line-height:1.55;\n    transition:border-color 160ms, background 160ms;\n  }\n  .p1 .phase-item:hover{border-left-color:var(--accent-1);}\n  .p2 .phase-item:hover{border-left-color:var(--accent-2);}\n  .p3 .phase-item:hover{border-left-color:var(--accent-3);}\n  .p4 .phase-item:hover{border-left-color:var(--accent-4);}\n  .p5 .phase-item:hover{border-left-color:var(--accent-5);}\n\n  .approach-banner{\n    margin-top:22px;padding:16px 18px;border-radius:10px;\n    background:var(--surface-3);border:1px solid var(--hairline);\n  }\n  .approach-title{\n    font-size:10px;font-weight:800;text-transform:uppercase;letter-spacing:.14em;\n    color:var(--ink-dim);margin-bottom:12px;\n  }\n  .approach-row{display:flex;gap:12px;margin-bottom:10px;align-items:flex-start;}\n  .approach-row:last-child{margin-bottom:0;}\n  .approach-badge{\n    font-size:9.5px;font-weight:800;padding:3px 10px;border-radius:999px;\n    white-space:nowrap;flex-shrink:0;margin-top:1px;letter-spacing:.04em;\n  }\n  .badge-ci{background:var(--accent-2-bg);color:var(--accent-2);border:1px solid rgba(79,212,168,0.4);}\n  .badge-bb{background:rgba(255,138,106,0.08);color:var(--accent-5);border:1px solid rgba(255,138,106,0.4);}\n  .approach-text{font-size:12px;color:var(--ink-2);line-height:1.55;}\n\n  /* Bottom nav */\n  .bottom-nav{\n    display:flex;justify-content:space-between;align-items:center;\n    padding:12px 26px;border-top:1px solid var(--hairline);\n    background:var(--surface-2);\n  }\n  .nav-arrow{\n    padding:8px 18px;border:1px solid var(--hairline-strong);\n    border-radius:8px;background:transparent;\n    font-size:12.5px;font-weight:600;letter-spacing:.01em;\n    color:var(--ink-dim);cursor:pointer;\n    transition:all 160ms;\n  }\n  .nav-arrow:hover:not(:disabled){background:var(--surface-3);color:var(--ink);border-color:var(--surface-4);}\n  .nav-arrow:disabled{opacity:0.25;cursor:default;}\n  .layer-indicator{font-size:11.5px;color:var(--ink-dim);letter-spacing:.02em;}\n  .share-btn{\n    padding:7px 12px;border:1px solid var(--hairline-strong);\n    border-radius:8px;background:transparent;\n    font-size:11px;font-weight:600;\n    color:var(--ink-dim);cursor:pointer;\n    transition:all 160ms;\n    display:inline-flex;align-items:center;gap:6px;\n  }\n  .share-btn:hover{color:var(--ink);border-color:var(--surface-4);}\n  .share-btn svg{width:11px;height:11px;}\n  .share-btn.copied{color:var(--accent-2);border-color:var(--accent-2);}\n\n  /* Toast */\n  .toast{\n    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);\n    background:var(--surface-3);border:1px solid var(--hairline-strong);\n    color:var(--ink);padding:10px 16px;border-radius:999px;\n    font-size:12px;font-weight:600;\n    opacity:0;pointer-events:none;\n    transition:opacity 180ms, transform 180ms cubic-bezier(.2,0,0,1);\n    z-index:200;\n  }\n  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}\n\n  @media (max-width: 720px){\n    body{padding:12px 8px;}\n    .app-header{padding:14px 16px 0;}\n    .l1-header,.l2-wrap,.l3-wrap,.l1-body{padding-left:16px;padding-right:16px;}\n    .tab-btn{padding:12px 4px;font-size:12px;}\n    .tab-kbd{display:none;}\n    .ba-grid{grid-template-columns:1fr;}\n  }\n<\u002Fstyle>\n<\u002Fhead>\n<body>\n\n<div class=\"app\" id=\"app\" data-tab=\"0\" data-dir=\"fwd\">\n  <div class=\"accent-bar\"><\u002Fdiv>\n  <div class=\"app-header\">\n    <p class=\"brand\">Sojo Industries · Blueprint Initiative<\u002Fp>\n    <div class=\"tab-bar\" role=\"tablist\">\n      <button class=\"tab-btn active\" data-tab=\"0\" role=\"tab\">\n        <span class=\"dot\"><\u002Fspan>Current state<span class=\"tab-kbd\">1<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"tab-btn\" data-tab=\"1\" role=\"tab\">\n        <span class=\"dot\"><\u002Fspan>Why blueprint is a better option<span class=\"tab-kbd\">2<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"tab-btn\" data-tab=\"2\" role=\"tab\">\n        <span class=\"dot\"><\u002Fspan>The diagram<span class=\"tab-kbd\">3<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"tab-btn\" data-tab=\"3\" role=\"tab\">\n        <span class=\"dot\"><\u002Fspan>Next steps<span class=\"tab-kbd\">4<\u002Fspan>\n      <\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div class=\"stage\">\n\n    <!-- ===== Tab 0 — Current State Swimlane ===== -->\n    <div class=\"layer active\" id=\"layer-0\">\n      <div class=\"l2-wrap\">\n        <div class=\"diagram-stage\" id=\"swim-stage\" style=\"aspect-ratio: 1500 / 1100;\">\n          <iframe class=\"diagram-frame\" id=\"swim-frame\" src=\"\" title=\"Current State Swimlane\" style=\"width:1500px;height:1100px;\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== Tab 1 — Why Blueprint ===== -->\n    <div class=\"layer\" id=\"layer-1\">\n      <div class=\"l1-header\">\n        <p class=\"l1-title\">Why the blueprint model is better<\u002Fp>\n        <p class=\"l1-sub\">The case for replacing our current workflow<\u002Fp>\n      <\u002Fdiv>\n      <div class=\"l1-body\" id=\"why-cards\">\n        <!-- populated by JS -->\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== Tab 2 — Diagram ===== -->\n    <div class=\"layer\" id=\"layer-2\">\n      <div class=\"l2-wrap\">\n        <div class=\"l2-head\">\n          <div class=\"diagram-nav\" role=\"tablist\">\n            <button class=\"diag-btn active\" data-diag=\"overview\">Overview flow<\u002Fbutton>\n            <button class=\"diag-btn\" data-diag=\"example\">Worked example<\u002Fbutton>\n            <button class=\"diag-btn\" data-diag=\"logic\">Decision logic<\u002Fbutton>\n          <\u002Fdiv>\n          <button class=\"focus-btn\" id=\"focus-btn\" title=\"Expand diagram\">\n            <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n              <path d=\"M3 6V3h3M13 6V3h-3M3 10v3h3M13 10v3h-3\"><\u002Fpath>\n            <\u002Fsvg>\n            Focus\n          <\u002Fbutton>\n        <\u002Fdiv>\n        <div class=\"diagram-stage\" id=\"diagram-stage\">\n          <iframe class=\"diagram-frame\" id=\"diagram-frame\" src=\"\" title=\"Blueprint Process Flow\"><\u002Fiframe>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <!-- ===== Tab 3 — Next Steps ===== -->\n    <div class=\"layer\" id=\"layer-3\">\n      <div class=\"l3-wrap\">\n        <p class=\"l3-title\">Next steps<\u002Fp>\n        <p class=\"l3-sub\">The roadmap for making the blueprint model real<\u002Fp>\n        <div class=\"timeline\" id=\"timeline\">\n          <!-- populated by JS -->\n        <\u002Fdiv>\n\n        <div class=\"approach-banner\">\n          <p class=\"approach-title\">Implementation philosophy<\u002Fp>\n          <div class=\"approach-row\">\n            <span class=\"approach-badge badge-ci\">Continuous<\u002Fspan>\n            <p class=\"approach-text\">Everything above the CO level (Phases 1–4) → continuous improvement, no big bang required, refine as you go.<\u002Fp>\n          <\u002Fdiv>\n          <div class=\"approach-row\">\n            <span class=\"approach-badge badge-bb\">Big bang<\u002Fspan>\n            <p class=\"approach-text\">Everything at the operations level (Phase 5 and WO/SOP structure) → big bang, fully think through every aspect before rolling out. One incomplete decision creates downstream problems across every work order from that point forward.<\u002Fp>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n  <\u002Fdiv>\n\n  <div class=\"bottom-nav\">\n    <button class=\"nav-arrow\" id=\"btn-prev\" disabled=\"\">← Prev<\u002Fbutton>\n    <span class=\"layer-indicator\" id=\"layer-label\">Layer 1 of 4 · Current state<\u002Fspan>\n    <div style=\"display:flex;gap:8px;align-items:center;\">\n      <button class=\"share-btn\" id=\"share-btn\" title=\"Copy shareable link\">\n        <svg viewBox=\"0 0 16 16\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\">\n          <path d=\"M6 10l4-4M6 6H4a2 2 0 000 4h2M10 10h2a2 2 0 000-4h-2\"><\u002Fpath>\n        <\u002Fsvg>\n        <span id=\"share-label\">Share view<\u002Fspan>\n      <\u002Fbutton>\n      <button class=\"nav-arrow\" id=\"btn-next\">Next →<\u002Fbutton>\n    <\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<!-- Focus overlay (C3) -->\n<div class=\"focus-overlay\" id=\"focus-overlay\">\n  <div class=\"focus-stage\" id=\"focus-stage\">\n    <button class=\"focus-close\" id=\"focus-close\" title=\"Close (Esc)\">×<\u002Fbutton>\n    <iframe class=\"focus-frame\" id=\"focus-frame\" title=\"Blueprint Process Flow (focus)\"><\u002Fiframe>\n    <div class=\"focus-hint\">Press <strong>Esc<\u002Fstrong> to close · <strong>Space<\u002Fstrong> to cycle views<\u002Fdiv>\n  <\u002Fdiv>\n<\u002Fdiv>\n\n<div class=\"toast\" id=\"toast\">Link copied<\u002Fdiv>\n\n<script>\n  /* Wire iframe srcs from bundled resources (or fall back to relative paths) */\n  (function(){\n    var r=window.__resources||{};\n    var swim=document.getElementById('swim-frame');\n    var diag=document.getElementById('diagram-frame');\n    if(swim) swim.src=(r.swimFrame||'Current State Swimlane.html?v=3')+'#embed';\n    if(diag) diag.src=(r.diagramFrame||'Blueprint Process Flow.html?v=5')+'#embed';\n  })();\n<\u002Fscript>\n<script src=\"77fdc834-e22b-47b2-9b63-781f928a7aef\"><\u002Fscript>\n\n\n\n<\u002Fbody><\u002Fhtml>"
