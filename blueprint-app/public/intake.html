  --c-var:  #D4A830; --bg-var: rgba(212,168,48,0.10);  --bd-var: rgba(212,168,48,0.45);
  --c-itm:  #5ACA5A; --bg-itm: rgba(90,202,90,0.10);   --bd-itm: rgba(90,202,90,0.45);
  --c-bom:  #4ACAC8; --bg-bom: rgba(74,202,200,0.10);  --bd-bom: rgba(74,202,200,0.45);
  --c-rm:   #E898D0; --bg-rm:  rgba(232,152,208,0.10); --bd-rm:  rgba(232,152,208,0.45);
  --c-wo:   #E07A7A; --bg-wo:  rgba(224,122,122,0.10); --bd-wo:  rgba(224,122,122,0.45);
  --c-co:   #B8A0E8; --bg-co:  rgba(184,160,232,0.10); --bd-co:  rgba(184,160,232,0.45);
  --c-ca:   #FFA070; --bg-ca:  rgba(255,160,112,0.10); --bd-ca:  rgba(255,160,112,0.45);
  --c-ac:   #9090A0; --bg-ac:  rgba(144,144,160,0.10); --bd-ac:  rgba(144,144,160,0.45);
  --c-sop:  #A0B0F0; --bg-sop: rgba(160,176,240,0.10); --bd-sop: rgba(160,176,240,0.45);
  --c-plan: #2AAA8A; --bg-plan: rgba(42,170,138,0.10); --bd-plan: rgba(42,170,138,0.45); /* Production Plan — warm teal */

}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font-family: 'Manrope', sans-serif; font-size: 14px; line-height: 1.6; min-height: 100vh; }

.fe-toast { position: fixed; bottom: 20px; right: 20px; z-index: 600; background: #15151C; border: 1px solid var(--c-new); color: var(--c-new); padding: 10px 16px; border-radius: 8px; font-size: 12.5px; font-weight: 700; opacity: 0; transform: translateY(8px); transition: opacity 0.2s, transform 0.2s; pointer-events: none; }

/* ─── IntakeForm.jsx — customer intake form. Polished light theme, contained

.in-stage {

<body>
<div class="in-stage" id="intakeView"></div>

<script src="/intake-data.js"></script>

<script>
/* Inlined from validation.js + flags.js (gating + flag logic) */
/* validation.js — required-field gating for the intake form (Part B).
   ─────────────────────────────────────────────────────────────────────────
   Pure logic, no DOM. The form's render + navigation code calls these.
   A field's `required` flag lives in intake-data.js — toggling it there
   changes gating here with no component edits.

   Rules:
   - A field BLOCKS advancing when it is required, VISIBLE (showIf satisfied),
     not satisfied by a "Not sure" mark, and empty.
   - A required field hidden by showIf never blocks.
*/
'use strict';

function vIsEmpty(v) {
  return v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0);
}

function vIsVisible(f, answers) {
  if (!f || !f.showIf) return true;
  const v = answers[f.showIf.field];
  if (f.showIf.equals !== undefined) return v === f.showIf.equals;
  if (f.showIf.equalsAny) return f.showIf.equalsAny.includes(v);
  return true;
}

// Does this field block progress?  answers = the field's value bag,
// ns = the matching Not-sure map (may be null for BOM rows).
function vFieldBlocks(f, answers, ns) {
  if (!f || f.type === 'note' || !f.required) return false;
  if (!vIsVisible(f, answers)) return false;                 // hidden by showIf → never blocks
  if (ns && ns[f.id]) return false;                          // "Not sure" satisfies the requirement
  if (f.showIf && ns && ns[f.showIf.field]) return false;    // parent marked Not sure → companion waived
  return vIsEmpty(answers[f.id]);
}

// Keys of every blocking field in a section. Plain field → its id.
// BOM row field → "bom:<rowIndex>:<fieldId>". Used for the Next gate and
// the inline "Required to continue" highlights.
function vSectionBlockingKeys(sec, answers, ns, bomRows, bomFields) {
  const keys = [];
  (sec.fields || []).forEach(f => { if (vFieldBlocks(f, answers, ns)) keys.push(f.id); });
  if (sec.type === 'bom' && Array.isArray(bomRows)) {
    if (!bomRows.length) keys.push('bom:none');
    bomRows.forEach((r, ri) => (bomFields || []).forEach(f => {
      if (f.required && f.type !== 'note' && vIsVisible(f, r) && vIsEmpty(r[f.id])) keys.push('bom:' + ri + ':' + f.id);
    }));
  }
  return keys;
}

/* flags.js — field flagging for the intake form (Part C). No DOM.
   ─────────────────────────────────────────────────────────────────────────
   A flag = a field the customer (or reviewer) wants Sojo to look at, with a
   "reason" note. Flags are kept in IN_STATE so they ride in the draft + the
   submission payload, and db.js writes them to the flags table.

   Three ways a field gets flagged:
   1. Explicit  — the ⚑ popover (a typed reason)        → stored in flagsO / product.flags
   2. Not sure  — the "Not sure?" button                → auto-flag, default note
   3. Custom    — a dropdown answered with the custom    → auto-flag, default note
                  sentinel or "Other (specify)" supplier

   Flag key per field:  plain field → field id;  BOM row field → "bom:<ri>:<id>".
   One flag per (product, key); explicit notes win over auto notes.
*/
'use strict';

/* ── Not-Sure config (edit text / requiredness here, not in the components) ── */
const NS_PROMPT = "Tell us why you couldn't complete this field — this helps our team follow up.";
const NS_NOTE_REQUIRED = false;   // set true to force a note before the customer can Save
const NS_VALUE = 'NOT_SURE';      // marker stored in the flag row's value column

function flMap(scope) {
  return scope === 'o' ? IN_STATE.flagsO : IN_STATE.products[IN_STATE.active].flags;
}
// A Not-sure entry is stored as { note } (object → always truthy so gating still
// treats the field as answered). Older drafts stored `true`; handle both.
function flNsNote(entry) { return (entry && typeof entry === 'object' && entry.note) ? entry.note : ''; }
function flNsOn(scope, key) { const m = scope === 'o' ? IN_STATE.nsO : IN_STATE.products[IN_STATE.active].ns; return !!(m && m[key]); }
function flAutoNote(kind) {
  return kind === 'ns'
    ? 'Customer marked "Not sure" — review with customer'
    : 'Customer entered their own value (not from a dropdown)';
}
function flBomTitle() {
  const s = INTAKE_SECTIONS.find(x => x.type === 'bom');
  return s ? s.title : 'Raw Materials & Packaging';
}
function flValOf(store, id, f) {
  let v = store ? store[id] : '';
  if (v === INTAKE_CUSTOM_SENTINEL) v = (store[id + 'Custom'] || '');
  return Array.isArray(v) ? v.join(', ') : (v == null ? '' : String(v));
}

/* ── metadata lookups (label / section / current value) ── */
function flOvMeta(id) {
  const f = (INTAKE_SECTIONS[0].fields || []).find(x => x.id === id);
  return { label: f ? f.label : id, value: flValOf(IN_STATE.overview, id, f) };
}
function flProdMeta(p, key) {
  if (key.indexOf('bom:') === 0) {
    const parts = key.split(':'), ri = +parts[1], fid = parts[2];
    const f = BOM_ROW_FIELDS.find(x => x.id === fid);
    return { label: (f ? f.label : fid) + ' (material ' + (ri + 1) + ')', section: flBomTitle(), value: flValOf((p.bom && p.bom[ri]) || {}, fid, f) };
  }
  const sec = INTAKE_SECTIONS.filter(s => s.scope === 'product').find(s => (s.fields || []).some(x => x.id === key));
  const f = sec ? sec.fields.find(x => x.id === key) : null;
  return { label: f ? f.label : key, section: sec ? sec.title : '', value: flValOf(p.answers, key, f) };
}

/* ── is a field flagged (for any reason)? drives the ⚑ active state ── */
function flIsFlagged(scope, key, store, ns) {
  if (flMap(scope) && flMap(scope)[key]) return true;
  if (ns && ns[key]) return true;
  if (store) {
    if (store[key] === INTAKE_CUSTOM_SENTINEL) return true;
    if ((key === 'wipSupplier' || key === 'pkgSupplier') && store[key] === 'Other (specify)') return true;
  }
  return false;
}
// BOM variant (no Not-sure map for BOM rows)
function flBomFlagged(key, row, fid) {
  if (flMap('p') && flMap('p')[key]) return true;
  if (row[fid] === INTAKE_CUSTOM_SENTINEL) return true;
  if (fid === 'supplier' && row.supplier === 'Other (specify)') return true;
  return false;
}

/* ── the note shown in the popover for a key (explicit wins, else auto) ── */
function flNoteFor(scope, key, store, ns) {
  if (ns && ns[key]) return flNsNote(ns[key]);     // Not-sure → the customer's typed note (may be '')
  const m = flMap(scope);
  if (m && m[key]) return m[key].note || '';
  if (store && (store[key] === INTAKE_CUSTOM_SENTINEL || ((key === 'wipSupplier' || key === 'pkgSupplier') && store[key] === 'Other (specify)'))) return flAutoNote('custom');
  return '';
}

/* ── save / clear an explicit flag (+ best-effort live persist) ── */
function flSave(scope, key, note) {
  const m = flMap(scope);
  m[key] = { note: note || '', at: new Date().toISOString() };
  if (typeof inSave === 'function') inSave();
  flPush(scope, key);                         // write the row now so it lands in the flags table
}
function flClear(scope, key) {
  const m = flMap(scope);
  if (m) delete m[key];
  if (scope === 'o') { if (IN_STATE.nsO) delete IN_STATE.nsO[key]; }
  else { const ns = IN_STATE.products[IN_STATE.active].ns; if (ns) delete ns[key]; }
  if (typeof inSave === 'function') inSave();
}

/* ── custom-entered (✍) values for a product ── */
function flCustomEntries(p) {
  const out = [];
  INTAKE_SECTIONS.filter(s => s.scope === 'product' && s.type !== 'bom').forEach(s => (s.fields || []).forEach(f => {
    if (Array.isArray(f.options) && f.options.includes(INTAKE_CUSTOM_SENTINEL) && p.answers[f.id] === INTAKE_CUSTOM_SENTINEL)
      out.push({ field_id: f.id, label: f.label, section: s.title, value: p.answers[f.id + 'Custom'] || '(not entered)' });
  }));
  if (p.answers.wipSupplier === 'Other (specify)') out.push({ field_id: 'wipSupplier', label: 'WIP Supplier', section: flBomTitle(), value: p.answers.wipSupplierOther || '(not entered)' });
  if (p.answers.pkgSupplier === 'Other (specify)') out.push({ field_id: 'pkgSupplier', label: 'Packaging Supplier', section: flBomTitle(), value: p.answers.pkgSupplierOther || '(not entered)' });
  (p.bom || []).forEach((r, ri) => BOM_ROW_FIELDS.forEach(f => {
    if (Array.isArray(f.options) && f.options.includes(INTAKE_CUSTOM_SENTINEL) && r[f.id] === INTAKE_CUSTOM_SENTINEL)
      out.push({ field_id: 'bom:' + ri + ':' + f.id, label: f.label + ' (material ' + (ri + 1) + ')', section: flBomTitle(), value: r[f.id + 'Custom'] || '(not entered)' });
    if (f.id === 'supplier' && r.supplier === 'Other (specify)')
      out.push({ field_id: 'bom:' + ri + ':supplier', label: 'Supplier (material ' + (ri + 1) + ')', section: flBomTitle(), value: r.supplierOther || '(not entered)' });
  }));
  return out;
}

/* ── build the full flag list for the payload (one row per flagged field) ── */
function flBuildAll() {
  const rows = [], seen = {};
  const add = (pi, field_id, o) => {
    const k = pi + '|' + field_id;
    if (seen[k]) return; seen[k] = 1;
    rows.push(Object.assign({ project_id: IN_STATE.id, field_id: field_id, product_index: pi, flagged_by: 'customer' }, o));
  };
  // Not-sure flags first so their NOT_SURE value + customer note win the (pi|id) slot.
  Object.keys(IN_STATE.nsO || {}).forEach(id => { const m = flOvMeta(id); add(null, id, { field_label: m.label, section: 'Project Overview', value: NS_VALUE, note: flNsNote(IN_STATE.nsO[id]) }); });
  Object.keys(IN_STATE.flagsO || {}).forEach(id => { const m = flOvMeta(id); add(null, id, { field_label: m.label, section: 'Project Overview', value: m.value, note: IN_STATE.flagsO[id].note || '' }); });
  IN_STATE.products.forEach((p, pi) => {
    Object.keys(p.ns || {}).forEach(id => { const m = flProdMeta(p, id); add(pi, id, { field_label: m.label, section: m.section, value: NS_VALUE, note: flNsNote(p.ns[id]) }); });
    Object.keys(p.flags || {}).forEach(key => { const m = flProdMeta(p, key); add(pi, key, { field_label: m.label, section: m.section, value: m.value, note: (p.flags[key].note || '') }); });
    flCustomEntries(p).forEach(c => add(pi, c.field_id, { field_label: c.label, section: c.section, value: c.value, note: flAutoNote('custom') }));
  });
  return rows;
}

/* ── best-effort live write so a flag becomes a flags-table row immediately ── */
function flPush(scope, key) {
  try {
    let row;
    if (scope === 'o') {
      const m = flOvMeta(key);
      row = { field_id: key, field_label: m.label, section: 'Project Overview', product_index: null, value: flNsOn('o', key) ? NS_VALUE : m.value, note: flNoteFor('o', key, IN_STATE.overview, IN_STATE.nsO), flagged_by: 'customer' };
    } else {
      const p = IN_STATE.products[IN_STATE.active];
      const m = flProdMeta(p, key);
      row = { field_id: key, field_label: m.label, section: m.section, product_index: IN_STATE.active, value: flNsOn('p', key) ? NS_VALUE : m.value, note: flNoteFor('p', key, p.answers, p.ns), flagged_by: 'customer' };
    }
    fetch('/api/submissions/' + encodeURIComponent(IN_STATE.id) + '/flags', {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(row),
    }).catch(function () {});
  } catch (e) { /* file:// or offline — flag still rides in the submit payload */ }
}
// Remove a live flag row (used when Not-sure is cancelled/unchecked).
function flPushRemove(scope, key) {
  try {
    fetch('/api/submissions/' + encodeURIComponent(IN_STATE.id) + '/flags/remove', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ field_id: key, product_index: scope === 'o' ? null : IN_STATE.active }),
    }).catch(function () {});
  } catch (e) { /* offline */ }
}

</script>

<script>
let feToastTimer;
function feToast(msg) {
  let el = document.getElementById('feToast');
  if (!el) { el = document.createElement('div'); el.id = 'feToast'; el.className = 'fe-toast'; document.body.appendChild(el); }
  el.textContent = msg; el.classList.add('show');
  clearTimeout(feToastTimer);
  feToastTimer = setTimeout(() => el.classList.remove('show'), 2200);
}

/* ╔═════════════════════════════════════════════════════════════════════════╗
   ║  VIEW: INTAKE FORM  (views/IntakeForm.jsx) — PROOF OF CONCEPT           ║
   ║  Customer-facing digital New Project Form. Renders entirely from        ║
   ║  intake-data.js (INTAKE_SECTIONS / BOM_ROW_FIELDS / APPROVED_SUPPLIERS  ║
   ║  / INTAKE_FIELD_MAP / COMPLEXITY_CONFIG). Light theme scoped to         ║
   ║  .in-stage. POC: persistence = localStorage per project-id; files       ║
   ║  store filename only; submit/email hooks are stubs.                     ║
   ╚═════════════════════════════════════════════════════════════════════════╝ */
let IN_STATE = null;
let IR_PROD = 0;

function inIsEmpty(v) { return v === undefined || v === null || v === '' || (Array.isArray(v) && v.length === 0); }
function inVisible(f, answers) {
  if (!f.showIf) return true;
  const v = answers[f.showIf.field];
  if (f.showIf.equals !== undefined) return v === f.showIf.equals;
  if (f.showIf.equalsAny) return f.showIf.equalsAny.includes(v);
  return true;
}
function inNewProduct(n) { return { name: 'Product ' + n, answers: {}, bom: [{}], ns: {}, flags: {} }; }
let IN_FLAG_OPEN = null;   // scope|key of the currently-open popup (ephemeral UI)
let IN_FLAG_MODE = 'flag'; // 'ns' = Not-sure notes popup · 'flag' = manual ⚑ flag popover
function inNsMap(scope) { return scope === 'project' || scope === 'o' ? IN_STATE.nsO : IN_STATE.products[IN_STATE.active].ns; }

function inInit() {
  const param = new URLSearchParams(location.search).get('intake');
  let id = param || localStorage.getItem('bpIntakeCurrent');
  if (!id) id = 'PRJ-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  localStorage.setItem('bpIntakeCurrent', id);
  try { IN_STATE = JSON.parse(localStorage.getItem('bpIntake_' + id)); } catch (e) { IN_STATE = null; }
  if (!IN_STATE) IN_STATE = { id, created: new Date().toISOString(), overview: {}, products: [inNewProduct(1)], active: 0, activeSection: 's1', confirmed: false, submitted: false, lastSaved: null };
  IN_STATE.id = id;
  // migrate older saved drafts: ensure Not-sure + flag maps exist
  if (!IN_STATE.nsO) IN_STATE.nsO = {};
  if (!IN_STATE.flagsO) IN_STATE.flagsO = {};
  IN_STATE.products.forEach(p => { if (!p.ns) p.ns = {}; if (!p.flags) p.flags = {}; });
  // migrate: complianceArtwork was a free-text textarea before becoming a checklist
  IN_STATE.products.forEach(p => {
    if (typeof p.answers.complianceArtwork === 'string' && p.answers.complianceArtwork) {
      if (!p.answers.complianceArtworkNotes) p.answers.complianceArtworkNotes = p.answers.complianceArtwork;
      delete p.answers.complianceArtwork;
    }
  });
  // migrate: fields converted from free entry to dropdowns — a saved value that
  // matches no option moves into the Custom companion (and gets the ✍ flag)
  const inMigrateToSentinel = (vals, fields) => fields.forEach(f => {
    if (!Array.isArray(f.options) || !f.options.includes(INTAKE_CUSTOM_SENTINEL)) return;
    const v = vals[f.id];
    if (v && v !== INTAKE_CUSTOM_SENTINEL && !f.options.includes(String(v))) {
      if (!vals[f.id + 'Custom']) vals[f.id + 'Custom'] = v;
      vals[f.id] = INTAKE_CUSTOM_SENTINEL;
    }
  });
  IN_STATE.products.forEach(p => {
    INTAKE_SECTIONS.filter(s => s.scope === 'product').forEach(s => inMigrateToSentinel(p.answers, s.fields));
    p.bom.forEach(r => inMigrateToSentinel(r, BOM_ROW_FIELDS));
  });
  setInterval(() => { const el = document.getElementById('inSaved'); if (el && IN_STATE.lastSaved) el.textContent = 'Last saved ' + Math.max(0, Math.round((Date.now() - IN_STATE.lastSaved) / 1000)) + 's ago'; }, 5000);
  setInterval(inSave, 30000);  // spec: autosave every 30s (also saves on every change)
}
function inSave() {
  if (!IN_STATE) return;
  IN_STATE.lastSaved = Date.now();
  try { localStorage.setItem('bpIntake_' + IN_STATE.id, JSON.stringify(IN_STATE)); } catch (e) {}
  const el = document.getElementById('inSaved');
  if (el) el.textContent = 'Last saved just now';
}

/* ── Not sure — customer flags a field for the Sojo team to review with them.
   A Not-sure field counts as answered for completion; it surfaces in the
   customer summary, the Internal Review follow-up list, and the payload. ── */
/* ── "Not sure" — selecting it opens a notes popup; the note rides on the flag.
   Save keeps the selection; Cancel undoes it; un-checking clears note + flag. ── */
function inToggleNS(scope, id) {
  const ns = inNsMap(scope);
  if (ns[id]) {                                   // un-check → clear note + remove flag
    delete ns[id];
    inSave(); flPushRemove(scope, id);
    if (IN_FLAG_OPEN === inFlagKey(scope, id)) IN_FLAG_OPEN = null;
    inRender();
  } else {                                        // select → mark, write flag, open notes popup
    ns[id] = { note: '' };
    inSave(); flPush(scope, id);
    IN_FLAG_MODE = 'ns'; IN_FLAG_OPEN = inFlagKey(scope, id);
    inRender();
    const ta = document.getElementById('inFlagNote'); if (ta) ta.focus();
  }
}

/* ── popup markup + handlers (shared by the Not-sure popup and the ⚑ flag) ── */
function inFlagKey(scope, key) { return scope + '|' + key; }
function inOpenFlag(scope, key) { IN_FLAG_MODE = 'flag'; IN_FLAG_OPEN = inFlagKey(scope, key); inRender(); }
function inCloseFlag(scope, key) {
  // Cancel on the Not-sure popup undoes the selection so the field isn't left half-set.
  if (IN_FLAG_MODE === 'ns' && scope != null) {
    const ns = inNsMap(scope); delete ns[key];
    inSave(); flPushRemove(scope, key);
  }
  IN_FLAG_OPEN = null; inRender();
}
function inSaveFlag(scope, key) {
  const ta = document.getElementById('inFlagNote');
  const note = ta ? ta.value : '';
  if (IN_FLAG_MODE === 'ns') {                     // store the note on the Not-sure entry
    inNsMap(scope)[key] = { note: note };
    inSave(); flPush(scope, key);
    IN_FLAG_OPEN = null; inRender(); feToast('🤔 Noted — we’ll follow up');
  } else {                                         // manual ⚑ flag
    flSave(scope, key, note);
    IN_FLAG_OPEN = null; inRender(); feToast('⚑ Field flagged for review');
  }
}
function inClearFlag(scope, key) {
  flClear(scope, key);
  IN_FLAG_OPEN = null; inRender(); feToast('Flag cleared');
}
// Inline popup shown under a field when its Not-sure / ⚑ popup is open.
function inFlagPopHTML(scope, key, store, ns) {
  if (IN_FLAG_OPEN !== inFlagKey(scope, key)) return '';
  const isNs = IN_FLAG_MODE === 'ns';
  const note = flNoteFor(scope, key, store, ns);
  if (isNs) {
    const needNote = (typeof NS_NOTE_REQUIRED !== 'undefined' && NS_NOTE_REQUIRED);
    const saveDisabled = needNote && !String(note).trim() ? ' disabled' : '';
    return `<div class="in-flagpop">
      <div class="fp-title">🤔 Not sure?</div>
      <div class="fp-prompt">${inEsc(typeof NS_PROMPT !== 'undefined' ? NS_PROMPT : "Tell us why — this helps our team follow up.")}</div>
      <textarea id="inFlagNote" placeholder="Optional — what made this hard to answer?"${needNote ? ` oninput="var b=document.getElementById('inFlagSaveBtn');b.disabled=!this.value.trim()"` : ''}>${inEsc(note)}</textarea>
      <div class="fp-actions">
        <button type="button" id="inFlagSaveBtn" class="fp-save"${saveDisabled} onclick="inSaveFlag('${scope}','${key}')">Save</button>
        <button type="button" class="fp-cancel" onclick="inCloseFlag('${scope}','${key}')">Cancel</button>
      </div>
    </div>`;
  }
  return `<div class="in-flagpop">
    <div class="fp-title">⚑ Reason for flag</div>
    <textarea id="inFlagNote" placeholder="Why does this need Sojo's review?">${inEsc(note)}</textarea>
    <div class="fp-actions">
      <button type="button" class="fp-save" onclick="inSaveFlag('${scope}','${key}')">Save flag</button>
      <button type="button" class="fp-clear" onclick="inClearFlag('${scope}','${key}')">Clear flag</button>
      <button type="button" class="fp-cancel" onclick="inCloseFlag()">Cancel</button>
    </div>
  </div>`;
}

/* ── completion ── */
// Labels of unsatisfied required fields in a section (for the review summary).
// Gating logic itself lives in validation.js (vFieldBlocks).
function inSectionMissing(sec, prodIdx) {
  const answers = sec.scope === 'project' ? IN_STATE.overview : IN_STATE.products[prodIdx].answers;
  const ns = sec.scope === 'project' ? IN_STATE.nsO : IN_STATE.products[prodIdx].ns;
  const missing = [];
  if (sec.type === 'bom') {
    const rows = IN_STATE.products[prodIdx].bom;
    if (!rows.length) missing.push('At least one material row');
    rows.forEach((r, i) => BOM_ROW_FIELDS.forEach(f => { if (f.required && f.type !== 'note' && vIsVisible(f, r) && inIsEmpty(r[f.id])) missing.push('Row ' + (i + 1) + ': ' + f.label); }));
  }
  sec.fields.forEach(f => { if (vFieldBlocks(f, answers, ns)) missing.push(f.label); });
  return missing;
}
function inSectionComplete(sec, prodIdx) { return inSectionMissing(sec, prodIdx).length === 0; }
/* ── step-rail state (presentation only — derived from existing answers/flags) ──
   untouched (gray) · active/in-progress (blue) · complete (green) · flagged (amber) */
function inSectionHasFlag(sec, prodIdx) {
  if (sec.scope === 'project') return sec.fields.some(f => flIsFlagged('o', f.id, IN_STATE.overview, IN_STATE.nsO));
  const p = IN_STATE.products[prodIdx];
  if (sec.type === 'bom') return (p.bom || []).some((r, ri) => BOM_ROW_FIELDS.some(f => flBomFlagged('bom:' + ri + ':' + f.id, r, f.id)));
  return sec.fields.some(f => flIsFlagged('p', f.id, p.answers, p.ns));
}
function inSectionTouched(sec, prodIdx) {
  if (sec.scope === 'project') return sec.fields.some(f => !inIsEmpty(IN_STATE.overview[f.id]));
  const p = IN_STATE.products[prodIdx];
  if (sec.type === 'bom') return (p.bom || []).some(r => BOM_ROW_FIELDS.some(f => !inIsEmpty(r[f.id])));
  return sec.fields.some(f => !inIsEmpty(p.answers[f.id]));
}
function inStepState(sec, prodIdx) {
  if (inSectionComplete(sec, prodIdx)) return 'complete';
  if (inSectionHasFlag(sec, prodIdx)) return 'flagged';
  if (sec.id === IN_STATE.activeSection || inSectionTouched(sec, prodIdx)) return 'active';
  return 'untouched';
}
function inProductPct(pi) {
  const secs = INTAKE_SECTIONS.filter(s => s.scope === 'product');
  return Math.round(secs.filter(s => inSectionComplete(s, pi)).length / secs.length * 100);
}
function inOverallPct() {
  const prodSecs = INTAKE_SECTIONS.filter(s => s.scope === 'product');
  let done = inSectionComplete(INTAKE_SECTIONS[0], 0) ? 1 : 0, total = 1;
  IN_STATE.products.forEach((p, pi) => { total += prodSecs.length; done += prodSecs.filter(s => inSectionComplete(s, pi)).length; });
  return Math.round(done / total * 100);
}
function inAllComplete() {
  if (!inSectionComplete(INTAKE_SECTIONS[0], 0)) return false;
  return IN_STATE.products.every((p, pi) => INTAKE_SECTIONS.filter(s => s.scope === 'product').every(s => inSectionComplete(s, pi)));
}

/* ── complexity engine (internal only — never rendered in the customer form) ── */
function gradeProduct(prod) {
  const a = prod.answers;
  const max = COMPLEXITY_CONFIG.rules.reduce((s, r) => s + r.points, 0);
  let rm = 0, fg = 0; const hits = [];
  COMPLEXITY_CONFIG.rules.forEach(r => {
    let hit = false; const w = r.when;
    if (w.special === 'unknownSupplier') {
      hit = [a.wipSupplier, a.pkgSupplier].concat(prod.bom.map(x => x.supplier)).some(s => s === 'Other (specify)');
    } else {
      const v = a[w.field];
      if (w.equals !== undefined) hit = v === w.equals;
      else if (w.notEquals !== undefined) hit = !inIsEmpty(v) && v !== w.notEquals;
      else if (w.equalsAny) hit = w.equalsAny.includes(v);
    }
    if (hit) { hits.push({ id: r.id, label: r.label, points: r.points, bucket: r.bucket }); if (r.bucket === 'rm') rm += r.points; else fg += r.points; }
  });
  const pct = Math.round((rm + fg) / max * 100);
  const band = pct > COMPLEXITY_CONFIG.banding.high ? 'High' : pct >= COMPLEXITY_CONFIG.banding.moderate ? 'Moderate' : 'Low';
  return { rawMaterialScore: rm, finishedGoodsScore: fg, total: rm + fg, max, pct, band, drivers: hits };
}

/* ── state setters ── */
function inSet(scope, id, value, rerender) {
  (scope === 'o' ? IN_STATE.overview : IN_STATE.products[IN_STATE.active].answers)[id] = value;
  inSave();
  if (rerender) inRender(); else inRenderProgress();
}
function inToggleMulti(scope, id, opt, checked) {
  const a = scope === 'o' ? IN_STATE.overview : IN_STATE.products[IN_STATE.active].answers;
  const arr = Array.isArray(a[id]) ? a[id] : [];
  a[id] = checked ? arr.concat(opt) : arr.filter(x => x !== opt);
  inSave(); inRenderProgress();
}
function inSetFile(scope, id, input) {
  inSet(scope, id, input.files.length ? '📎 ' + input.files[0].name : '', true);
}
function inSetBom(ri, id, value, rerender) {
  IN_STATE.products[IN_STATE.active].bom[ri][id] = value;
  inSave();
  if (rerender) inRender(); else inRenderProgress();
}
function inAddBomRow() { IN_STATE.products[IN_STATE.active].bom.push({}); inSave(); inRender(); }
function inDelBomRow(ri) { IN_STATE.products[IN_STATE.active].bom.splice(ri, 1); inSave(); inRender(); }

/* ── products ── */
function inAddProduct() {
  IN_STATE.products.push(inNewProduct(IN_STATE.products.length + 1));
  IN_STATE.active = IN_STATE.products.length - 1;
  IN_STATE.activeSection = 's2';
  inSave(); inRender();
}
function inSelProduct(pi) {
  IN_STATE.active = pi;
  if (INTAKE_SECTIONS.find(s => s.id === IN_STATE.activeSection)?.scope === 'project') IN_STATE.activeSection = 's2';
  inSave(); inRender();
}
function inRenameProduct(pi) {
  const name = prompt('Product name:', IN_STATE.products[pi].name);
  if (name && name.trim()) { IN_STATE.products[pi].name = name.trim(); inSave(); inRender(); }
}
function inDelProduct(pi) {
  if (IN_STATE.products.length === 1) { feToast('⚠ At least one product is required'); return; }
  if (!confirm('Remove ' + IN_STATE.products[pi].name + '? Its answers will be deleted.')) return;
  IN_STATE.products.splice(pi, 1);
  IN_STATE.active = Math.min(IN_STATE.active, IN_STATE.products.length - 1);
  inSave(); inRender();
}

/* ── navigation — HARD gating (Part B): can't advance past a section with an
   empty visible required field. Backward moves and the Review step stay open. ── */
function inSectionBlockingKeys(sec, prodIdx) {
  const answers = sec.scope === 'project' ? IN_STATE.overview : IN_STATE.products[prodIdx].answers;
  const ns = sec.scope === 'project' ? IN_STATE.nsO : IN_STATE.products[prodIdx].ns;
  const bom = sec.type === 'bom' ? IN_STATE.products[prodIdx].bom : null;
  return vSectionBlockingKeys(sec, answers, ns, bom, BOM_ROW_FIELDS);
}
function inGoSection(secId) {
  const order = ['s1'].concat(INTAKE_SECTIONS.filter(s => s.scope === 'product').map(s => s.id)).concat(['review']);
  const cur = INTAKE_SECTIONS.find(s => s.id === IN_STATE.activeSection);
  const curPos = order.indexOf(IN_STATE.activeSection), tgtPos = order.indexOf(secId);
  // Moving forward to another section is blocked while the current section has
  // unsatisfied required fields. The Review step stays reachable so the customer
  // can always see what's outstanding (Submit there is independently gated).
  if (cur && tgtPos > curPos && secId !== 'review' && inSectionBlockingKeys(cur, IN_STATE.active).length) {
    feToast('⚠ Complete the required fields highlighted below to continue');
    inRender(); return;
  }
  IN_STATE.activeSection = secId;
  IN_FLAG_OPEN = null;
  inSave(); inRender();
  const v = document.getElementById('intakeView'); if (v) v.scrollIntoView({ behavior: 'smooth', block: 'start' });
}
function inJump(pi, secId) { IN_STATE.active = pi; IN_STATE.activeSection = secId; inSave(); inRender(); }

/* ── share / project links (POC: localStorage-backed) ── */
function inLink() { return location.origin + location.pathname + '?intake=' + IN_STATE.id; }
function inCopyLink() { try { navigator.clipboard.writeText(inLink()); feToast('✓ Link copied — ' + IN_STATE.id); } catch (e) { prompt('Copy this link:', inLink()); } }
function inMailto() {
  const body = "You've been invited to complete a Sojo Industries project intake form. Use your unique link below — your progress saves automatically and you can return anytime:%0D%0A%0D%0A" + encodeURIComponent(inLink());
  window.open('mailto:?subject=' + encodeURIComponent('Sojo Industries — Project Intake Form') + '&body=' + body);
}
function inNewProject() {
  if (!confirm('Start a fresh intake with a new project ID?')) return;
  const id = 'PRJ-' + Math.random().toString(36).slice(2, 8).toUpperCase();
  localStorage.setItem('bpIntakeCurrent', id);
  IN_STATE = { id, created: new Date().toISOString(), overview: {}, nsO: {}, flagsO: {}, products: [inNewProduct(1)], active: 0, activeSection: 's1', confirmed: false, submitted: false, lastSaved: null };
  inSave(); inRender();
}

/* ── customer-entered (✍) values — delegates to flags.js (single source). ── */
function inCustomEntries(p) {
  return flCustomEntries(p).map(c => ({ field: c.label, value: c.value }));
}

/* ── payload + submit ── */
function inBuildPayload() {
  return {
    projectId: IN_STATE.id,
    submittedAt: new Date().toISOString(),
    overview: Object.assign({}, IN_STATE.overview),
    flags: flBuildAll(),                                              // authoritative flag list (Part C)
    notSureOverview: Object.keys(IN_STATE.nsO).map(k => irFieldLabel(k)),
    products: IN_STATE.products.map(p => ({
      name: p.name,
      answers: Object.assign({}, p.answers),
      bomComponents: p.bom.map(r => Object.assign({}, r)),
      complexity: gradeProduct(p),
      notSureFields: Object.keys(p.ns).map(k => irFieldLabel(k)),       // review-with-customer list
      customEnteredValues: inCustomEntries(p),                          // ✍ flags
      fieldMappings: Object.keys(INTAKE_FIELD_MAP).map(k => {
        const m = INTAKE_FIELD_MAP[k];
        let v = IN_STATE.overview[k] !== undefined ? IN_STATE.overview[k] : (k === 'bomRows' ? p.bom : p.answers[k]);
        if (v === INTAKE_CUSTOM_SENTINEL) v = (p.answers[k + 'Custom'] || '') + ' (customer-entered)';
        return { formField: k, value: v === undefined ? null : v, notSure: !!(IN_STATE.nsO[k] || p.ns[k]), record: m.record, section: m.section, fieldName: m.fieldName };
      }),
    })),
    stubs: { customerConfirmationEmail: 'NOT SENT — wire to backend', internalTeamNotification: 'NOT SENT — wire to backend' },
  };
}
function inExportPayload() {
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([JSON.stringify(inBuildPayload(), null, 2)], { type: 'application/json' }));
  a.download = 'intake-' + IN_STATE.id + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  feToast('✓ Payload exported');
}
function inSubmit() {
  if (!inAllComplete() || !IN_STATE.confirmed) return;
  const payload = inBuildPayload();
  const finish = () => { IN_STATE.submitted = true; inSave(); inRender(); };
  // POST to the backend when one is available (the deployed web app).
  // Falls back to a local-only submit when opened as a standalone file
  // (file://) or with no server — the JSON payload export still works.
  fetch('/api/submissions', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload),
  })
    .then(r => { if (!r.ok) throw new Error('HTTP ' + r.status); return r.json(); })
    .then(() => { feToast('✓ Submitted to Sojo — project ' + IN_STATE.id); finish(); })
    .catch(() => { feToast('⚠ Saved on this device — no server connection'); finish(); });
}

/* ── field renderers ── */
function inEsc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;'); }
function inOpts(f) { return f.options === 'suppliers' ? APPROVED_SUPPLIERS : (f.options || []); }
function inFieldHTML(f, answers, setFn, nsMap) {
  if (!inVisible(f, answers)) return '';
  const v = answers[f.id];
  const scope = setFn === 'inSetO' ? 'o' : 'p';
  const ns = nsMap || inNsMap(scope);
  const nsOn = !!ns[f.id];
  const dis = nsOn ? ' disabled' : '';
  const cond = f.showIf ? ' in-conditional' : '';
  const full = (f.type === 'textarea' || f.type === 'multiselect' || f.type === 'note' || f.type === 'file') ? ' full' : '';
  if (f.type === 'note') return `<div class="in-note${cond}">${f.label}</div>`;
  const blocked = vFieldBlocks(f, answers, ns);
  const flagged = flIsFlagged(scope, f.id, answers, ns);
  const label = `<div class="in-label-row"><label class="in-label">${f.label}${f.required ? ' <span class="req">*</span>' : ''}</label>` +
    `<span class="in-fieldbtns">` +
    `<button type="button" class="in-ns${nsOn ? ' on' : ''}" title="Mark this for your Sojo CSM to walk through with you" onclick="inToggleNS('${scope}','${f.id}')">${nsOn ? '🤔 Not sure ✓' : 'Not sure?'}</button>` +
    `<button type="button" class="in-flag${flagged ? ' on' : ''}" title="Flag this field for Sojo review" onclick="inOpenFlag('${scope}','${f.id}')">⚑</button>` +
    `</span></div>` +
    (f.helper ? `<div class="in-helper">${f.helper}</div>` : '');
  let input = '';
  if (f.type === 'select') {
    input = `<select class="in-select"${dis} onchange="${setFn}('${f.id}',this.value,true)"><option value="">Select an option</option>` +
      inOpts(f).map(o => `<option${v === o ? ' selected' : ''}>${o}</option>`).join('') + '</select>';
  } else if (f.type === 'multiselect') {
    input = `<div class="in-checks">` + inOpts(f).map(o =>
      `<label><input type="checkbox"${dis}${Array.isArray(v) && v.includes(o) ? ' checked' : ''} onchange="inToggleMulti('${scope}','${f.id}','${o}',this.checked)">${o}</label>`).join('') + '</div>';
  } else if (f.type === 'textarea') {
    input = `<textarea class="in-textarea"${dis} onchange="${setFn}('${f.id}',this.value)">${inEsc(v)}</textarea>`;
  } else if (f.type === 'file') {
    input = `<label class="in-file"${nsOn ? ' style="pointer-events:none;opacity:0.5"' : ''}>${v ? `<span class="fname">${inEsc(v)}</span> — click to replace` : '📎 Click to attach a file (POC: filename only is stored)'}<input type="file"${dis} onchange="inSetFile('${scope}','${f.id}',this)"></label>`;
  } else {
    input = `<input class="in-input" type="${f.type}"${dis} value="${inEsc(v)}" onchange="${setFn}('${f.id}',this.value)">`;
  }
  const reqMsg = blocked ? `<div class="in-req-msg">Required to continue</div>` : '';
  const pop = inFlagPopHTML(scope, f.id, answers, ns);
  const st = blocked ? ' in-st-error' : flagged ? ' in-st-flag' : (!inIsEmpty(v) ? ' in-st-ok' : '');
  return `<div class="in-field${full}${cond}${nsOn ? ' ns-on' : ''}${blocked ? ' in-required-missing' : ''}${st}">${label}${input}${reqMsg}${pop}</div>`;
}
function inSetO(id, value, rr) { inSet('o', id, value, rr); }
function inSetP(id, value, rr) { inSet('p', id, value, rr); }

function inBomRowHTML(r, ri) {
  const cells = BOM_ROW_FIELDS.map(f => {
    if (!inVisible(f, r)) return '';
    const v = r[f.id];
    const key = 'bom:' + ri + ':' + f.id;
    const flagged = flBomFlagged(key, r, f.id);
    const blocked = f.required && f.type !== 'note' && vIsVisible(f, r) && inIsEmpty(v);
    const label = `<div class="in-label-row"><label class="in-label">${f.label}${f.required ? ' <span class="req">*</span>' : ''}</label>` +
      `<button type="button" class="in-flag${flagged ? ' on' : ''}" title="Flag this field for Sojo review" onclick="inOpenFlag('p','${key}')">⚑</button></div>` +
      (f.helper ? `<div class="in-helper">${f.helper}</div>` : '');
    let input;
    if (f.type === 'select') input = `<select class="in-select" onchange="inSetBom(${ri},'${f.id}',this.value,true)"><option value="">Select an option</option>` + inOpts(f).map(o => `<option${v === o ? ' selected' : ''}>${o}</option>`).join('') + '</select>';
    else input = `<input class="in-input" type="${f.type}" value="${inEsc(v)}" onchange="inSetBom(${ri},'${f.id}',this.value)">`;
    const reqMsg = blocked ? `<div class="in-req-msg">Required to continue</div>` : '';
    const pop = inFlagPopHTML('p', key, r, null);
    const st = blocked ? ' in-st-error' : flagged ? ' in-st-flag' : (!inIsEmpty(v) ? ' in-st-ok' : '');
    return `<div class="in-field${f.showIf ? ' in-conditional' : ''}${blocked ? ' in-required-missing' : ''}${st}">${label}${input}${reqMsg}${pop}</div>`;
  }).join('');
  return `<div class="in-bom-row"><div class="rowhdr"><span>MATERIAL ${ri + 1}</span><button class="rowdel" type="button" onclick="inDelBomRow(${ri})">Remove row</button></div><div class="in-grid">${cells}</div></div>`;
}

/* ── main render ── */
function buildIntakeView() { inRender(); }
function inRenderProgress() {
  const o = document.getElementById('inOverallBar'); if (o) { o.style.width = inOverallPct() + '%'; }
  const ol = document.getElementById('inOverallLbl'); if (ol) ol.textContent = inOverallPct() + '% complete';
  document.querySelectorAll('.in-prod-pill .pct').forEach((el, i) => { if (IN_STATE.products[i]) el.textContent = inProductPct(i) + '%'; });
}
function inRender() {
  const wrap = document.getElementById('intakeView');
  if (!wrap) return;
  if (IN_STATE.submitted) {
    wrap.innerHTML = `<div class="in-shell"><div class="in-card in-done">
      <div class="big">✅</div><h2>Intake received — thank you!</h2>
      <p>Project <strong>${IN_STATE.id}</strong> with ${IN_STATE.products.length} product${IN_STATE.products.length === 1 ? '' : 's'} has been recorded. Your Sojo CSM will review the submission and follow up on anything that needs clarification.</p>
      <p style="font-size:11px;color:#8A9AB5">POC stubs: customer confirmation email + internal team notification are logged in the payload, ready to wire to a backend.</p>
      <button class="in-btn" type="button" onclick="inExportPayload()">⬇ Export JSON payload</button>
      <button class="in-btn ghost" type="button" style="margin-left:8px" onclick="IN_STATE.submitted=false;IN_STATE.confirmed=false;inSave();inRender()">Reopen form</button>
    </div></div>`;
    return;
  }
  const prodSecs = INTAKE_SECTIONS.filter(s => s.scope === 'product');
  const pills = IN_STATE.products.map((p, pi) =>
    `<div class="in-prod-pill${pi === IN_STATE.active ? ' active' : ''}" onclick="inSelProduct(${pi})">${inEsc(p.name)} <span class="pct">${inProductPct(pi)}%</span>` +
    `<span class="pedit" title="Rename" onclick="event.stopPropagation();inRenameProduct(${pi})">✎</span>` +
    `<span class="px" title="Remove" onclick="event.stopPropagation();inDelProduct(${pi})">✕</span></div>`).join('') +
    `<button class="in-prod-add" type="button" onclick="inAddProduct()">＋ Add Another Product</button>`;
  const navBtns = [INTAKE_SECTIONS[0]].concat(prodSecs).map(s =>
    `<button class="${IN_STATE.activeSection === s.id ? 'active' : ''}" onclick="inGoSection('${s.id}')"><span class="in-dot in-dot-${inStepState(s, IN_STATE.active)}"></span>${s.num}. ${s.title}</button>`).join('') +
    `<button class="${IN_STATE.activeSection === 'review' ? 'active' : ''}" onclick="inGoSection('review')"><span class="in-dot in-dot-${inAllComplete() ? 'complete' : (IN_STATE.activeSection === 'review' ? 'active' : 'untouched')}"></span>10. Review &amp; Submit</button>`;
  let content = '';
  if (IN_STATE.activeSection === 'review') {
    content = inReviewSectionHTML();
  } else {
    const sec = INTAKE_SECTIONS.find(s => s.id === IN_STATE.activeSection) || INTAKE_SECTIONS[0];
    const isProj = sec.scope === 'project';
    const answers = isProj ? IN_STATE.overview : IN_STATE.products[IN_STATE.active].answers;
    const setFn = isProj ? 'inSetO' : 'inSetP';
    let inner = '';
    if (sec.type === 'bom') {
      inner = IN_STATE.products[IN_STATE.active].bom.map((r, ri) => inBomRowHTML(r, ri)).join('') +
        `<button class="in-addrow" type="button" onclick="inAddBomRow()">＋ Add material row</button>` +
        `<div class="in-grid">` + sec.fields.map(f => inFieldHTML(f, answers, setFn)).join('') + `</div>`;
    } else {
      inner = `<div class="in-grid">` + sec.fields.map(f => inFieldHTML(f, answers, setFn)).join('') + `</div>`;
    }
    const idx = ['s1'].concat(prodSecs.map(s => s.id)).concat(['review']);
    const cur = idx.indexOf(sec.id);
    const blockingKeys = inSectionBlockingKeys(sec, IN_STATE.active);
    const blocked = blockingKeys.length > 0;
    const warn = blocked ? `<div class="in-warn">Complete the ${blockingKeys.length} required field${blockingKeys.length === 1 ? '' : 's'} highlighted above to continue.</div>` : '';
    content = `<div class="in-card">
      <div class="in-card-scroll">
        <div class="in-sec-title">${sec.num}. ${sec.title}${isProj ? '' : ' <span style="font-size:12px;color:var(--in-muted);font-weight:600">· ' + inEsc(IN_STATE.products[IN_STATE.active].name) + '</span>'}</div>
        <div class="in-sec-desc">${sec.desc}</div>
        ${inner}
        ${warn}
      </div>
      <div class="in-foot">
        <button class="in-btn ghost" type="button" ${cur <= 0 ? 'disabled' : ''} onclick="inGoSection('${idx[Math.max(0, cur - 1)]}')">← Back</button>
        <button class="in-btn${blocked ? '' : ' in-next-ready'}" type="button" ${blocked ? 'disabled' : ''} onclick="inGoSection('${idx[Math.min(idx.length - 1, cur + 1)]}')">Continue →</button>
      </div>
    </div>`;
  }
  wrap.innerHTML = `<div class="in-shell">
    <div class="in-top"><i id="inOverallBar" style="width:${inOverallPct()}%"></i></div>
    <div class="in-header">
      <div class="in-logo">S</div>
      <div class="in-head-text"><h1>Sojo Industries · New Project Intake</h1><p>Project ID: <strong>${IN_STATE.id}</strong> · <span id="inOverallLbl">${inOverallPct()}% complete</span> · saves automatically</p></div>
      <div class="in-head-right">
        <div class="in-share">
          <button type="button" onclick="inCopyLink()">🔗 Copy link</button>
          <button type="button" onclick="inMailto()">✉ Email link</button>
          <button type="button" onclick="inNewProject()">＋ New intake</button>
        </div>
        <div class="in-saved" id="inSaved">${IN_STATE.lastSaved ? 'Last saved recently' : 'Not saved yet'}</div>
      </div>
    </div>
    <div class="in-poc-note">⚠ Proof of concept — answers save in this browser per project link. File uploads store the filename only. Backend transport (cross-device resume, file delivery, emails) is stubbed for later wiring.</div>
    <div class="in-products">${pills}</div>
    <div class="in-body"><div class="in-secnav">${navBtns}</div>${content}</div>
  </div>`;
}

/* Section 10 — Review & Submit. Grouped by product; each section a collapsible
   card with an Edit jump; flagged / Not-Sure fields called out in amber. */
function inReviewSectionHTML() {
  const prodSecs = INTAKE_SECTIONS.filter(s => s.scope === 'product');
  // One collapsible section card (defaults open when it still has missing fields).
  function secCard(sec, answers, ns, scope, pi) {
    const rows = sec.fields.filter(f => f.type !== 'note' && inVisible(f, answers) && (!inIsEmpty(answers[f.id]) || ns[f.id]))
      .map(f => {
        const flagged = flIsFlagged(scope, f.id, answers, ns);
        let val;
        if (ns[f.id]) val = '🤔 Not sure';
        else if (answers[f.id] === INTAKE_CUSTOM_SENTINEL) val = inEsc(answers[f.id + 'Custom'] || '—') + ' ✍';
        else val = inEsc(Array.isArray(answers[f.id]) ? answers[f.id].join(', ') : answers[f.id]);
        const note = flagged ? flNoteFor(scope, f.id, answers, ns) : '';
        return `<div class="in-sum-row${flagged ? ' flagged' : ''}"><span class="k">${f.label}</span><span class="v">${val}${flagged && note ? `<span class="in-sum-note">⚑ ${inEsc(note)}</span>` : ''}</span></div>`;
      }).join('');
    const missing = inSectionMissing(sec, pi);
    return `<details class="in-rev-sec"${missing.length ? ' open' : ''}>
      <summary><span class="in-dot in-dot-${inStepState(sec, pi)}"></span>${sec.num}. ${sec.title}
        <a class="edit" href="#" onclick="event.preventDefault();inJump(${pi},'${sec.id}')">Edit</a><span class="chev">▸</span></summary>
      <div class="in-rev-body">${rows || '<div class="in-sum-row"><span class="k">No answers yet</span></div>'}${missing.length ? `<div class="in-warn" style="margin-top:8px">${missing.length} required field${missing.length === 1 ? '' : 's'} still needed</div>` : ''}</div>
    </details>`;
  }
  let body = `<div class="in-sec-title">Review &amp; Submit</div><div class="in-sec-desc">Check everything below, then submit. Items you flagged or marked “Not sure” are highlighted in amber for our team.</div>`;
  body += `<div class="in-review-prod"><h3>Project Overview</h3>${secCard(INTAKE_SECTIONS[0], IN_STATE.overview, IN_STATE.nsO, 'o', 0)}</div>`;
  IN_STATE.products.forEach((p, pi) => {
    const saveActive = IN_STATE.active; IN_STATE.active = pi;   // evaluate flags/state in product context
    body += `<div class="in-review-prod"><h3>📦 ${inEsc(p.name)}</h3>`;
    prodSecs.forEach(sec => {
      if (sec.type === 'bom') {
        const missing = inSectionMissing(sec, pi);
        const rows = p.bom.map((r, ri) => `<div class="in-sum-row"><span class="k">Material ${ri + 1}</span><span class="v">${inEsc(r.materialDesc || '—')} · ${inEsc(r.materialType || '?')} · qty ${inEsc(r.bomQty || '?')}</span></div>`).join('');
        body += `<details class="in-rev-sec"${missing.length ? ' open' : ''}><summary><span class="in-dot in-dot-${inStepState(sec, pi)}"></span>${sec.num}. ${sec.title}<a class="edit" href="#" onclick="event.preventDefault();inJump(${pi},'${sec.id}')">Edit</a><span class="chev">▸</span></summary><div class="in-rev-body">${rows}${missing.length ? `<div class="in-warn" style="margin-top:8px">${missing.length} required field${missing.length === 1 ? '' : 's'} still needed</div>` : ''}</div></details>`;
      } else {
        body += secCard(sec, p.answers, p.ns, 'p', pi);
      }
    });
    body += `</div>`;
    IN_STATE.active = saveActive;
  });
  body += `<div class="in-confirm"><input type="checkbox" id="inConfirm" ${IN_STATE.confirmed ? 'checked' : ''} onchange="IN_STATE.confirmed=this.checked;inSave();inRender()"><label for="inConfirm">I confirm this information is accurate to the best of my knowledge</label></div>`;
  const ready = inAllComplete();
  const lastSec = prodSecs[prodSecs.length - 1].id;
  return `<div class="in-card">
    <div class="in-card-scroll">${body}</div>
    <div class="in-foot">
      <button class="in-btn ghost" type="button" onclick="inGoSection('${lastSec}')">← Back</button>
      <button class="in-btn in-submit-final${ready && IN_STATE.confirmed ? ' in-next-ready' : ''}" type="button" ${ready && IN_STATE.confirmed ? '' : 'disabled'} onclick="inSubmit()">Submit intake${ready ? '' : ' — complete all required fields first'}</button>
    </div>
  </div>`;
}


function irFieldLabel(k) {
  for (const s of INTAKE_SECTIONS) { const f = s.fields.find(x => x.id === k); if (f) return f.label; }
  if (k === 'bomRows') return 'BOM component rows (Section 8)';
  return k;
}

/* ── standalone bootstrap ── */
inInit();
inRender();
</script>
